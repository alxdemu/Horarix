<style>
  :root{
    --bg:#FFFFFF;
    --bg-alt:#F5F7FA;
    --border:#E1E6EB;
    --text:#1F2933;
    --text-dim:#5B6B79;
    --blue:#1B75BC;
    --blue-dark:#145A93;
    --blue-pale:#EAF3FB;
    --conflict:#D64545;
    --conflict-bg:#FBEAEA;
    --success:#2F9E63;
    --sans: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: "Consolas", "SFMono-Regular", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  header.app-header{
    padding:14px clamp(16px,4vw,48px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand .logo{
    height:38px;
    width:auto;
    display:block;
  }
  .brand .logo-upc{
    height:34px;
    border-radius:50%;
  }
  .brand .logo-divider{
    font-size:16px;
    color:var(--border);
    font-weight:400;
  }
  header.app-header h1{
    margin:0 0 0 4px;
    font-size:22px;
    font-weight:700;
    color:var(--text);
    padding-left:12px;
    border-left:1px solid var(--border);
  }
  .lang-select{
    width:auto;
    margin:0;
    font-size:13px;
    padding:6px 8px;
  }

  .layout{
    display:grid;
    grid-template-columns: 300px 1fr 320px;
    gap:0;
    align-items:start;
  }
  @media (max-width: 1000px){
    .layout{grid-template-columns:1fr;}
  }

  .panel{
    padding:20px clamp(12px,3vw,24px);
    border-right:1px solid var(--border);
    min-height:60vh;
  }
  .panel:last-child{border-right:none;}
  .panel h2{
    font-size:14px;
    margin:0 0 14px;
    color:var(--text);
    font-weight:700;
    border-bottom:1px solid var(--border);
    padding-bottom:8px;
  }

  input[type="text"], select, input[type="number"]{
    width:100%;
    background:#fff;
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 10px;
    border-radius:4px;
    font-family:var(--sans);
    font-size:14px;
    margin-bottom:8px;
  }
  input[type="text"]:focus, select:focus{
    outline:2px solid var(--blue);
    outline-offset:1px;
  }

  .semester-label{
    display:block; font-size:11px; font-weight:700; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px;
  }
  .semester-select{
    font-weight:700;
    border-color:var(--blue);
    margin-bottom:14px;
  }

  .course-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px 12px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .course-card .meta{flex:1; min-width:0;}
  .course-card .code-row{display:flex; align-items:center; gap:6px;}
  .course-card .code{font-family:var(--mono); font-size:12px; color:var(--blue); font-weight:600;}
  .info-btn{
    width:16px; height:16px; border-radius:50%;
    background:var(--bg-alt); border:1px solid var(--border);
    color:var(--text-dim); font-size:10px; font-weight:700; font-style:italic;
    line-height:1; padding:0; flex-shrink:0;
  }
  .info-btn:hover{background:var(--blue-pale); color:var(--blue-dark); border-color:var(--blue);}
  .degree-popover{
    margin-top:6px; padding:8px 10px;
    background:var(--blue-pale); border:1px solid var(--blue);
    border-radius:6px; font-size:11.5px;
  }
  .degree-popover-title{font-weight:700; color:var(--blue-dark); margin-bottom:5px;}
  .degree-popover-body{display:flex; flex-wrap:wrap; gap:4px;}
  .degree-popover-hint{margin-top:6px; color:var(--text-dim); font-size:10.5px;}
  .course-card .name{font-size:13.5px; line-height:1.35; margin-top:2px; color:var(--text);}
  .course-card .tags{margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{
    font-size:10.5px;
    padding:2px 7px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text-dim);
  }
  .tag-sem{
    background:var(--blue-pale);
    border-color:var(--blue);
    color:var(--blue-dark);
    font-weight:600;
  }
  button{
    font-family:var(--sans);
    cursor:pointer;
  }
  .btn-add{
    background:var(--blue);
    color:#fff;
    border:none;
    font-weight:700;
    border-radius:4px;
    width:30px; height:30px;
    flex-shrink:0;
    font-size:16px;
    line-height:1;
  }
  .btn-add[disabled]{
    background:var(--success);
    cursor:default;
  }
  .btn-add:hover:not([disabled]){background:var(--blue-dark);}

  .empty-msg{
    font-size:13px;
    color:var(--text-dim);
    padding:14px 0;
    line-height:1.5;
  }

  .wishlist-item{
    background:#fff;
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px;
    margin-bottom:8px;
  }
  .wishlist-item .row1{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .wishlist-item .code{font-family:var(--mono); font-size:12px; color:var(--blue); font-weight:600;}
  .wishlist-item .name{font-size:13px; margin:3px 0 8px; color:var(--text);}
  .wishlist-item .controls{display:flex; align-items:center; gap:10px; font-size:12px; flex-wrap:wrap;}
  .wishlist-item .controls label{display:flex; align-items:center; gap:5px; color:var(--text-dim);}
  .group-select-label{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);
    margin-bottom:8px;
  }
  .group-select{
    flex:1; width:auto; margin:0; padding:5px 6px; font-size:12px;
  }
  .remove-btn{
    background:none; border:none; color:var(--text-dim);
    font-size:16px; padding:0 4px;
  }
  .remove-btn:hover{color:var(--conflict);}
  input[type="range"]{width:70px; vertical-align:middle;}

  .ects-bar{
    margin:14px 0 18px;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .ects-bar .track{
    height:8px; background:var(--bg-alt); border:1px solid var(--border);
    border-radius:4px; overflow:hidden; margin-top:5px;
  }
  .ects-bar .fill{height:100%; background:var(--blue); transition:width .2s ease;}
  .ects-bar .fill.over{background:var(--conflict);}

  .generate-btn{
    width:100%;
    background:var(--blue);
    color:#fff;
    border:none;
    padding:12px;
    font-weight:700;
    font-size:15px;
    border-radius:6px;
    margin-top:6px;
  }
  .generate-btn[disabled]{
    background:var(--bg-alt);
    color:var(--text-dim);
    cursor:not-allowed;
  }
  .generate-btn:hover:not([disabled]){background:var(--blue-dark);}

  .buffer-row{
    margin:0 0 16px;
    font-size:12px;
    color:var(--text-dim);
  }
  .buffer-row label{display:block; margin-bottom:4px;}
  .day-toggle{display:flex; gap:4px;}
  .day-toggle button{
    flex:1; background:#fff; border:1px solid var(--border); border-radius:4px;
    padding:6px 0; font-size:11.5px; font-weight:600; color:var(--text-dim);
  }
  .day-toggle button.excluded{background:var(--conflict); border-color:var(--conflict); color:#fff;}
  .buffer-input-row{display:flex; align-items:center; gap:6px;}

  .ics-btn{
    width:100%;
    background:#fff;
    color:var(--blue);
    border:1.5px solid var(--blue);
    padding:10px;
    font-weight:700;
    font-size:13.5px;
    border-radius:6px;
    margin-top:8px;
  }
  .ics-btn[disabled]{
    border-color:var(--border);
    color:var(--text-dim);
    cursor:not-allowed;
  }
  .ics-btn:hover:not([disabled]){background:var(--blue-pale);}

  .clear-btn{
    width:100%;
    background:none;
    color:var(--conflict);
    border:1px solid transparent;
    padding:8px;
    font-weight:600;
    font-size:12.5px;
    border-radius:6px;
    margin-top:6px;
  }
  .clear-btn[disabled]{
    color:var(--text-dim);
    cursor:not-allowed;
  }
  .clear-btn:hover:not([disabled]){background:var(--conflict-bg); border-color:var(--conflict);}

  .fallback-note{
    display:inline-block;
    margin-top:4px;
    font-size:10.5px;
    color:#8A6100;
    background:#FFF6E0;
    border:1px solid #F0DDA0;
    border-radius:3px;
    padding:2px 6px;
  }

  .cal-panel-head{
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:14px;
  }
  .half-toggle{display:flex; border:1px solid var(--border); border-radius:5px; overflow:hidden;}
  .half-toggle button{
    background:#fff; border:none; padding:5px 14px; font-size:12.5px; font-weight:600;
    color:var(--text-dim);
  }
  .half-toggle button + button{border-left:1px solid var(--border);}
  .half-toggle button.active{background:var(--blue); color:#fff;}

  /* ---- Weekrooster: eenvoudige, robuuste laag-op-laag opbouw met px-posities ---- */
  .calendar-wrap{overflow-x:auto;}
  .cal-inner{min-width:640px; border:1px solid var(--border); border-radius:6px; overflow:hidden;}
  .cal-header-row{display:flex; background:var(--bg-alt); border-bottom:1px solid var(--border);}
  .cal-header-spacer{flex:0 0 52px;}
  .cal-header-day{flex:1; text-align:center; padding:8px 4px; font-weight:700; font-size:12.5px; color:var(--text);}
  .cal-body{position:relative; background:#fff;}
  .cal-gutter{position:absolute; left:0; top:0; bottom:0; width:52px; border-right:1px solid var(--border);}
  .cal-time-label{position:absolute; right:6px; font-family:var(--mono); font-size:10px; color:var(--text-dim); line-height:1;}
  .cal-days{position:absolute; top:0; bottom:0; left:52px; right:0;}
  .cal-day-divider{position:absolute; top:0; bottom:0; width:1px; background:var(--border);}
  .cal-block{
    position:absolute;
    border-radius:4px;
    padding:3px 6px;
    font-size:10.5px;
    line-height:1.25;
    overflow:hidden;
    cursor:pointer;
    color:var(--text);
    border:1px solid var(--border);
    border-left:3px solid var(--blue);
    background:var(--blue-pale);
  }
  .cal-block .code{font-family:var(--mono); font-weight:700; font-size:10px;}
  .cal-block .room{opacity:0.8;}
  .cal-block:hover{filter:brightness(0.97);}
  .cal-empty-msg{padding:30px 10px; text-align:center; color:var(--text-dim); font-size:13px;}

  .not-placed{margin-top:20px;}
  .not-placed .item{
    font-size:13px;
    padding:8px 10px;
    border-left:3px solid var(--conflict);
    background:var(--conflict-bg);
    margin-bottom:6px;
    border-radius:0 4px 4px 0;
  }
  .not-placed .item.missing{border-left-color: var(--text-dim); background:var(--bg-alt);}
  .not-placed .item .name{font-weight:600; color:var(--text);}
  .not-placed .item .reason{color:var(--text-dim); font-size:12px; margin-top:2px;}

  .swap-panel{
    margin-top:10px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-radius:6px;
    padding:12px;
  }
  .swap-panel h3{margin:0 0 8px; font-size:13px; color:var(--text);}
  .swap-opt{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; border-bottom:1px solid var(--border); font-size:12.5px; color:var(--text);
  }
  .swap-opt:last-child{border-bottom:none;}
  .swap-opt button{
    background:var(--blue); color:#fff; border:none;
    padding:4px 10px; border-radius:4px; font-size:11.5px; font-weight:700;
  }
  .swap-opt.current button{background:var(--success);}
  .swap-opt .disabled-note{color:var(--text-dim); font-size:11px;}
  .close-swap{
    display:block; margin-top:8px; background:none; border:none;
    color:var(--text-dim); font-size:12px; text-decoration:underline;
  }

  .status-line{
    font-size:12px;
    color:var(--text-dim);
    margin-top:14px;
  }
  .list-block{margin-top:18px;}
  .list-block-title{
    font-weight:700; font-size:13px; color:var(--text);
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:6px;
  }
  .list-block-title .total{font-weight:600; font-size:12px; color:var(--blue); font-family:var(--mono);}
  .list-item{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:7px 10px; background:#fff; border:1px solid var(--border);
    border-radius:4px; margin-bottom:6px; font-size:12.5px;
  }
  .list-item .li-name{flex:1; min-width:0;}
  .list-item .li-code{font-family:var(--mono); color:var(--blue); font-weight:600; font-size:11.5px;}
  .list-item .li-ects{font-family:var(--mono); font-size:11px; color:var(--text-dim); white-space:nowrap;}
  .suggestion-item{cursor:pointer;}
  .suggestion-item:hover{background:var(--blue-pale); border-color:var(--blue);}
  .suggestion-item .add-icon{
    width:22px; height:22px; border-radius:50%; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;
  }
  .app-footer{
    padding:14px clamp(16px,4vw,48px) 24px;
    font-size:11px;
    color:var(--text-dim);
    text-align:center;
    border-top:1px solid var(--border);
    margin-top:8px;
  }
  .footer-dot{margin:0 6px;}

  /* Grotere aanraakdoelen voor touch-apparaten (iPad e.d.) */
  @media (pointer: coarse){
    .btn-add{width:38px; height:38px; font-size:19px;}
    .remove-btn{font-size:20px; padding:4px 8px;}
    input[type="range"]{height:28px;}
    .half-toggle button{padding:8px 16px;}
    .swap-opt button{padding:7px 14px;}
    select, input[type="text"], input[type="number"]{padding:11px 10px;}
  }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

<script>
/* ======================= GETESTE SOLVER-LOGICA (solver.js) ======================= */
// Kernlogica van de roosterbouwer -- geport vanuit build_schedule.py.
// Wordt apart getest in Node (test_solver.js) en daarna 1-op-1 in de
// webapp geplakt, zodat er geen tweede, ongeteste implementatie ontstaat.

function buildOptionsFromCompact(rawOptions, rooms, teachers) {
  // rawOptions: [[label, [[day,start,end,type,roomIdx,teacherIdx,period,cStart,cEnd,group], ...]], ...]
  return rawOptions.map(([label, sessArr]) => ({
    label,
    sessions: sessArr.map(([day, start, end, type, roomIdx, teacherIdx, period, cStart, cEnd, group]) => ({
      day, start, end, type,
      room: rooms[roomIdx],
      teacher: teachers[teacherIdx],
      period: period || "-",
      cStart: cStart || "",
      cEnd: cEnd || "",
      group: group || "",
    })),
  }));
}

function parseDDMMYYYY(s) {
  if (!s) return null;
  const m = /^(\d{2})-(\d{2})-(\d{4})$/.exec(s.trim());
  if (!m) return null;
  return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
}

function parsePeriodTags(p) {
  p = (p || "-").trim();
  if (p === "-" || p === "" || p === "CUSTOM") return new Set();
  return new Set(p.split(/\s+/));
}

function parity(tags) {
  if (tags.has("A")) return "A";
  if (tags.has("B")) return "B";
  return "both";
}

function half(tags) {
  if (tags.has("B1")) return "B1";
  if (tags.has("B2")) return "B2";
  return "both";
}

function periodsCanCoincide(a, b) {
  const pa = (a.period || "-").trim();
  const pb = (b.period || "-").trim();

  if (pa === "CUSTOM" && pb === "CUSTOM") {
    const da1 = parseDDMMYYYY(a.cStart), da2 = parseDDMMYYYY(a.cEnd);
    const db1 = parseDDMMYYYY(b.cStart), db2 = parseDDMMYYYY(b.cEnd);
    if (da1 && da2 && db1 && db2) {
      return da1 <= db2 && db1 <= da2;
    }
    return true; // onbekend -> voorzichtig aannemen dat het kan
  }

  const tagsA = parsePeriodTags(pa), tagsB = parsePeriodTags(pb);
  const parityA = parity(tagsA), parityB = parity(tagsB);
  const halfA = half(tagsA), halfB = half(tagsB);

  const parityOk = parityA === "both" || parityB === "both" || parityA === parityB;
  const halfOk = halfA === "both" || halfB === "both" || halfA === halfB;
  return parityOk && halfOk;
}

function isSameSlotMultiRoom(a, b) {
  return a.day === b.day && a.start === b.start && a.end === b.end
    && a.type === b.type && a.period === b.period;
}

// Herkent het gebouw uit een lokaalcode, bv. "TR1 2.07" -> "TR1",
// "TR11 0.11 - Lab. Control Industrial" -> "TR11", "G G-1 22.2" -> "G".
function buildingOf(room) {
  room = (room || "").trim();
  let m = /^([A-Za-z]+\d+)(?=\s|$|-)/.exec(room);
  if (m) return m[1];
  m = /^([A-Za-z]+)/.exec(room);
  return m ? m[1] : room;
}

// bufferMin: minuten die minimaal tussen twee lessen in VERSCHILLENDE
// gebouwen moeten zitten om praktisch haalbaar te zijn (verplaatsing op
// dezelfde campus). 0 = uitgeschakeld (oud gedrag, geen extra check).
function sessionsOverlap(a, b, bufferMin = 0) {
  if (a.day !== b.day) return false;
  const trueOverlap = a.start < b.end && b.start < a.end;
  if (trueOverlap) return periodsCanCoincide(a, b);
  if (bufferMin > 0 && periodsCanCoincide(a, b)) {
    const gap = a.start >= b.end ? a.start - b.end : b.start - a.end;
    if (gap < bufferMin && buildingOf(a.room) !== buildingOf(b.room)) return true;
  }
  return false;
}

function optionHasInternalOverlap(opt) {
  // Bewust ZONDER bufferMin: sessies binnen hetzelfde vak zijn door UPC zo
  // gepland, daar kan de student/solver toch niets aan veranderen door een
  // andere combinatie te kiezen -- het heeft dus geen zin dit als "ongeldige
  // optie" te weigeren.
  const s = opt.sessions;
  for (let i = 0; i < s.length; i++) {
    for (let j = i + 1; j < s.length; j++) {
      if (isSameSlotMultiRoom(s[i], s[j])) continue;
      if (sessionsOverlap(s[i], s[j])) return true;
    }
  }
  return false;
}

function optionConflictsWithPlaced(opt, placedSessions, bufferMin = 0) {
  for (const s of opt.sessions) {
    for (const ps of placedSessions) {
      if (isSameSlotMultiRoom(s, ps)) continue;
      if (sessionsOverlap(s, ps, bufferMin)) return true;
    }
  }
  return false;
}

/**
 * wishlist: [{code, priority, mandatory}]
 * courseOptionsMap: code -> [{label, sessions:[...]}]  (al gefilterd op interne overlap)
 * courseEcts: code -> number|null
 * maxEcts: number|null
 * bufferMin: minimale minuten tussen twee lessen in verschillende gebouwen (0=uit)
 *
 * Retourneert { selected: Map(code -> option), notSelected: [code,...],
 *               missing: [code,...], totalEcts, infeasibleMandatory: bool }
 */
function solveSchedule(wishlist, courseOptionsMap, courseEcts, maxEcts, overrides = {}, bufferMin = 0) {
  const seen = new Map();
  for (const { code, priority, mandatory } of wishlist) {
    const prev = seen.get(code);
    seen.set(code, { code, priority, mandatory: mandatory || (prev ? prev.mandatory : false) });
  }
  const dedupWishlist = [...seen.values()];

  const missing = [];
  const usable = [];
  for (const item of dedupWishlist) {
    const opts = courseOptionsMap[item.code];
    if (!opts || opts.length === 0) {
      missing.push(item.code);
      continue;
    }
    usable.push({ ...item, options: opts });
  }

  const placed = new Map();
  let placedSessions = [];
  let totalEcts = 0;

  function ectsOf(code) {
    const e = courseEcts[code];
    return typeof e === "number" ? e : 0;
  }

  // --- Handmatige keuzes (override) eerst plaatsen, indien conflictvrij ---
  const overriddenCodes = new Set();
  for (const item of usable) {
    const optIdx = overrides[item.code];
    if (optIdx == null) continue;
    const opt = item.options[optIdx];
    if (!opt) continue; // ongeldige index, negeren -> valt terug op normaal oplossen
    if (optionConflictsWithPlaced(opt, placedSessions, bufferMin)) continue; // conflicteert met eerdere override, negeren
    if (maxEcts != null && totalEcts + ectsOf(item.code) > maxEcts + 1e-9) continue;
    placed.set(item.code, opt);
    placedSessions = placedSessions.concat(opt.sessions);
    totalEcts += ectsOf(item.code);
    overriddenCodes.add(item.code);
  }

  const remaining = usable.filter(i => !overriddenCodes.has(i.code));
  const mandatoryItems = remaining.filter(i => i.mandatory)
    .sort((a, b) => a.options.length - b.options.length);
  const optionalItems = remaining.filter(i => !i.mandatory)
    .sort((a, b) => b.priority - a.priority);

  function backtrackMandatory(idx) {
    if (idx >= mandatoryItems.length) return true;
    const item = mandatoryItems[idx];
    for (const opt of item.options) {
      if (optionConflictsWithPlaced(opt, placedSessions, bufferMin)) continue;
      if (maxEcts != null && totalEcts + ectsOf(item.code) > maxEcts + 1e-9) continue;
      placed.set(item.code, opt);
      const added = opt.sessions;
      placedSessions = placedSessions.concat(added);
      totalEcts += ectsOf(item.code);

      if (backtrackMandatory(idx + 1)) return true;

      placed.delete(item.code);
      placedSessions = placedSessions.slice(0, placedSessions.length - added.length);
      totalEcts -= ectsOf(item.code);
    }
    return false;
  }

  const mandatoryOk = backtrackMandatory(0);
  if (!mandatoryOk) {
    return {
      selected: new Map(), notSelected: usable.map(i => i.code), missing,
      totalEcts: 0, infeasibleMandatory: true,
    };
  }

  const notSelected = [];
  for (const item of optionalItems) {
    let placedThis = false;
    for (const opt of item.options) {
      if (optionConflictsWithPlaced(opt, placedSessions, bufferMin)) continue;
      if (maxEcts != null && totalEcts + ectsOf(item.code) > maxEcts + 1e-9) continue;
      placed.set(item.code, opt);
      placedSessions = placedSessions.concat(opt.sessions);
      totalEcts += ectsOf(item.code);
      placedThis = true;
      break;
    }
    if (!placedThis) notSelected.push(item.code);
  }

  return { selected: placed, notSelected, missing, totalEcts, infeasibleMandatory: false };
}

function translateDegreeScope(scope) {
  const tokens = scope.split(/[\/\-\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
  return tokens.map(tok => (DEGREE_TOKENS[tok] && DEGREE_TOKENS[tok][currentLang]) || tok);
}

};
let currentLang = "en";
function t(key) { return I18N[currentLang][key]; }
function DAY_NAMES() { return DAY_NAMES_BY_LANG[currentLang]; }

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function levelLabel(level) {
  if (level === "bachelor") return t("bachelor");
  if (level === "master") return t("master");
  return capitalize(level);
}

// ---- Data opbouwen (per semester) ----
// courseIndex: code -> {code,name,ects,lang,level,scope,period,semesters:[idx,...]}
const courseIndex = {};
const NUM_SEMESTERS = RAW_DATA.semesterMeta.length;

for (const c of RAW_DATA.courses) {
  const [code, name, ects, langIdx, levelIdx, semList, scopeIdxArr, periodIdxArr] = c;
  courseIndex[code] = {
    code, name, ects,
    lang: RAW_DATA.languages[langIdx],
    level: RAW_DATA.levels[levelIdx],
    semesters: semList,
    scopes: scopeIdxArr.map(i => RAW_DATA.scopes[i] || ""),   // parallel aan semesters
    periods: periodIdxArr.map(i => RAW_DATA.periods[i] || ""), // parallel aan semesters
    fallbackSemesters: [],
  };
}
// Helper: haal de periode/opleiding op die bij een SPECIFIEK semester hoort
// (niet zomaar de eerste -- een dubbel-gelijst vak kan per semester verschillen).
function periodForSem(course, semIdx) {
  const i = course.semesters.indexOf(semIdx);
  return i === -1 ? "" : course.periods[i];
}
function scopeForSem(course, semIdx) {
  const i = course.semesters.indexOf(semIdx);
  return i === -1 ? "" : course.scopes[i];
}

// courseOptionsMapBySem[semIdx] = { code -> [{label, sessions}] }
const courseOptionsMapBySem = [];
for (let i = 0; i < NUM_SEMESTERS; i++) {
  const map = {};
  const raw = RAW_DATA.options[i] || {};
  for (const code of Object.keys(raw)) {
    map[code] = buildOptionsFromCompact(raw[code], RAW_DATA.rooms, RAW_DATA.teachers);
  }
  courseOptionsMapBySem.push(map);
}

const courseEcts = {};
for (const code in courseIndex) courseEcts[code] = courseIndex[code].ects;

function codesForSemester(semIdx) {
  return Object.keys(courseIndex).filter(
    c => courseIndex[c].semesters.includes(semIdx) && courseOptionsMapBySem[semIdx][c]
  );
}

function semesterLabel(semIdx) {
  const meta = RAW_DATA.semesterMeta[semIdx];
  const season = meta.isFall ? t("fall") : t("spring");
  return `${season} ${meta.yearRange}`;
}

// ---- State (alles per semester, zodat je plannen voor beide semesters naast
// elkaar kunt bewaren zonder dat wisselen van semester je werk overschrijft) ----
let currentSemesterIdx = 0; // default: eerstvolgende/aanstaande semester (fall)
let browseAll = false;      // true = "alle semesters" gekozen (enkel voor de vakkenlijst-weergave)
let excludedDays = new Set(); // dagen (1=ma..5=vr) waarop de student geen les wil -- globaal, niet per semester

function emptySemesterState() {
  return { wishlist: [], colorAssignment: {}, manualOverrides: {}, calendarHalf: "B1", lastResult: null };
}
let stateBySem = [];
for (let i = 0; i < NUM_SEMESTERS; i++) stateBySem.push(emptySemesterState());

function cur() { return stateBySem[currentSemesterIdx]; }

let openSwapCode = null;

function nextColorFor(semIdx) {
  const used = Object.values(stateBySem[semIdx].colorAssignment);
  for (const c of PALETTE) if (!used.includes(c)) return c;
  return PALETTE[Object.keys(stateBySem[semIdx].colorAssignment).length % PALETTE.length];
}

// ---- Persistente opslag (per gebruiker/browser, lokaal) ----
// Gebruikt localStorage in plaats van de Claude-specifieke window.storage-API,
// zodat dit ook correct werkt wanneer de app zelfstandig gehost wordt (bv. op
// GitHub Pages) en niet enkel binnen een Claude-artifact.
const STORAGE_KEY = "horarix_wishlist_v1";
function saveWishlist() {
  try {
    // lastResult bevat Option-objecten (niet trivially serialiseerbaar) -- die
    // hoeven we niet te bewaren, ze worden opnieuw berekend bij het laden.
    const toSave = stateBySem.map(s => ({
      wishlist: s.wishlist, colorAssignment: s.colorAssignment,
      manualOverrides: s.manualOverrides, calendarHalf: s.calendarHalf,
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      stateBySem: toSave, currentLang, currentSemesterIdx, browseAll,
      excludedDays: [...excludedDays],
    }));
  } catch (e) { console.warn("Opslaan mislukt (bv. privénavigatie of opslag vol)", e); }
}
function loadWishlist() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.stateBySem)) {
        stateBySem = parsed.stateBySem.map(s => ({
          wishlist: s.wishlist || [],
          colorAssignment: s.colorAssignment || {},
          manualOverrides: s.manualOverrides || {},
          calendarHalf: s.calendarHalf || "B1",
          lastResult: null,
        }));
        while (stateBySem.length < NUM_SEMESTERS) stateBySem.push(emptySemesterState());
      }
      currentLang = parsed.currentLang || "en";
      currentSemesterIdx = parsed.currentSemesterIdx ?? 0;
      if (currentSemesterIdx >= NUM_SEMESTERS) currentSemesterIdx = 0;
      browseAll = parsed.browseAll || false;
      excludedDays = new Set(parsed.excludedDays || []);
    }
  } catch (e) { /* nog geen opgeslagen wishlist, dat is prima */ }
}

// ---- Filters vullen ----
function uniqueSorted(arr) { return [...new Set(arr)].filter(Boolean).sort(); }
function populateSemesterSelect() {
  const sel = document.getElementById("filter-semester");
  sel.innerHTML = "";
  for (let i = 0; i < NUM_SEMESTERS; i++) {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = semesterLabel(i);
    sel.appendChild(o);
  }
  const allOpt = document.createElement("option");
  allOpt.value = "all";
  allOpt.textContent = t("allSemesters");
  sel.appendChild(allOpt);

}

// Vakcodes die zichtbaar horen te zijn in de vakkenlijst: bij "alle semesters"
// de vereniging van elk semester, anders enkel het huidige semester.
function activeBrowseCodes() {
  if (!browseAll) return codesForSemester(currentSemesterIdx);
  const set = new Set();
  for (let i = 0; i < NUM_SEMESTERS; i++) codesForSemester(i).forEach(c => set.add(c));
  return [...set];
}
function populateFilters() {
  const langSel = document.getElementById("filter-lang");
  langSel.querySelectorAll("option:not(#t-all-langs)").forEach(o => o.remove());
  uniqueSorted(RAW_DATA.languages).forEach(l => {
    const o = document.createElement("option"); o.value = l; o.textContent = l; langSel.appendChild(o);
  });
  const levelSel = document.getElementById("filter-level");
  levelSel.querySelectorAll("option:not(#t-all-levels)").forEach(o => o.remove());
  uniqueSorted(RAW_DATA.levels).forEach(l => {
    const o = document.createElement("option"); o.value = l;
    o.textContent = l === "bachelor" ? t("onlyBachelor") : l === "master" ? t("onlyMaster") : capitalize(l);

// ---- Vakkenlijst renderen ----
function renderCourseList() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const lang = document.getElementById("filter-lang").value;
  const level = document.getElementById("filter-level").value;
  const container = document.getElementById("course-list");
  container.innerHTML = "";

  const browseCodes = activeBrowseCodes();
  const inWishlist = new Set(cur().wishlist.map(w => w.code));
  let results = browseCodes.map(c => courseIndex[c]);
  if (q) results = results.filter(c => c.code.includes(q) || c.name.toLowerCase().includes(q));
  if (lang) results = results.filter(c => c.lang === lang);
  if (level) results = results.filter(c => c.level === level);
  results = results.slice(0, 150); // performance: niet duizenden DOM-nodes tegelijk

  if (results.length === 0) {
    container.innerHTML = `<div class="empty-msg">${t("noResults")}</div>`;
    return;
  }

  for (const c of results) {
    const div = document.createElement("div");
    div.className = "course-card";
    const already = inWishlist.has(c.code);
    // Bij "alle semesters": dit vak heeft mogelijk geen opties in het actief
    // planningssemester -- gebruik dan het eerste semester waar het WEL zit,
    // enkel voor weergavedoeleinden (periode, opleiding).
    const displaySem = courseOptionsMapBySem[currentSemesterIdx][c.code]
      ? currentSemesterIdx : c.semesters[0];
    const period = periodForSem(c, displaySem);
    const scope = scopeForSem(c, displaySem);
    // Semester-tag: altijd tonen (niet enkel bij "alle semesters") -- Fall,
    // Spring, of Fall/Spring als het vak in beide semesters gegeven wordt.
    const semTag = c.semesters.length > 1
      ? `${t("fall")}/${t("spring")}`
      : (RAW_DATA.semesterMeta[c.semesters[0]].isFall ? t("fall") : t("spring"));
    div.innerHTML = `
      <div class="meta">
        <div class="code-row">
          <span class="code">${c.code}${c.ects != null ? " · " + c.ects + " ECTS" : ""}</span>
          ${scope ? `<button class="info-btn" data-code="${c.code}" data-scope="${escapeHtml(scope)}" title="${t("degreeInfoTitle")}">i</button>` : ""}
        </div>
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="tags">
          <span class="tag">${c.lang.replace("Subjects in ", "")}</span>
          <span class="tag">${levelLabel(c.level)}</span>
          ${period ? `<span class="tag">${escapeHtml(period)}</span>` : ""}
          <span class="tag tag-sem">${semTag}</span>
        </div>
        <div class="degree-popover" data-code="${c.code}" hidden></div>
      </div>
      <button class="btn-add" ${already ? "disabled" : ""} data-code="${c.code}">${already ? "✓" : "+"}</button>
    `;
    container.appendChild(div);
  }
  container.querySelectorAll(".info-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const card = btn.closest(".course-card");
      const pop = card.querySelector(".degree-popover");
      const wasHidden = pop.hidden;
      container.querySelectorAll(".degree-popover").forEach(p => p.hidden = true);
      if (wasHidden) {
        const programs = translateDegreeScope(btn.dataset.scope);
        pop.innerHTML = `<div class="degree-popover-title">${t("degreeInfoTitle")}</div>
          <div class="degree-popover-body">${programs.map(p => `<span class="tag">${escapeHtml(p)}</span>`).join(" ")}</div>
          <div class="degree-popover-hint">${t("degreeInfoHint")}</div>`;
        pop.hidden = false;
      }
    });
  });
  container.querySelectorAll(".btn-add:not([disabled])").forEach(btn => {
    btn.addEventListener("click", () => addToWishlist(btn.dataset.code));
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

// ---- Wishlist ----
function addToWishlist(code) {
  // Bij "alle semesters" bladeren: als dit vak niet in het huidige actieve
  // planningssemester zit, automatisch overschakelen naar een semester waar
  // het wel zit (en dat zichtbaar maken door de dropdown mee te laten
  // opschuiven) -- zo kan een vak dat enkel in het voorjaar loopt nooit per
  // ongeluk in het najaarsplan terechtkomen.
  if (browseAll && !courseOptionsMapBySem[currentSemesterIdx][code]) {
    const target = courseIndex[code].semesters.find(s => courseOptionsMapBySem[s][code]);
    if (target == null) return; // zou niet moeten voorkomen, defensief
    currentSemesterIdx = target;
    browseAll = false;
    document.getElementById("filter-semester").value = String(target);
  }
  if (cur().wishlist.some(w => w.code === code)) return;
  cur().wishlist.push({ code, priority: 5, mandatory: false });
  cur().colorAssignment[code] = nextColorFor(currentSemesterIdx);
  saveWishlist();
  renderAll();
}
function removeFromWishlist(code) {
  cur().wishlist = cur().wishlist.filter(w => w.code !== code);
  delete cur().colorAssignment[code];
  delete cur().manualOverrides[code];
  if (openSwapCode === code) openSwapCode = null;
  saveWishlist();
  renderAll();
}
function clearWishlist() {
  // Wist enkel de vakselectie/het rooster van het HUIDIGE planningssemester --
  // dagvoorkeur, buffer en taal blijven staan, dat zijn algemene instellingen.
  cur().wishlist = [];
  cur().colorAssignment = {};
  cur().manualOverrides = {};
  cur().lastResult = null;
  openSwapCode = null;
  saveWishlist();
  renderAll();
  document.getElementById("calendar").innerHTML = `<div class="empty-msg">${t("noScheduleYet")}</div>`;
  document.getElementById("included-list").innerHTML = "";
  document.getElementById("suggestions-list").innerHTML = "";
  document.getElementById("swap-container").innerHTML = "";
  renderNotPlaced();
  renderStatus();
  document.getElementById("ics-btn").disabled = true;
}
function updatePriority(code, val) {
  const item = cur().wishlist.find(w => w.code === code);
  if (item) item.priority = Number(val);
  saveWishlist();
}
function updateMandatory(code, val) {
  const item = cur().wishlist.find(w => w.code === code);
  if (item) item.mandatory = val;
  saveWishlist();
  renderWishlist();
}

function renderWishlist() {
  const container = document.getElementById("wishlist-list");
  const emptyMsg = document.getElementById("wishlist-empty");
  container.innerHTML = "";
  emptyMsg.style.display = cur().wishlist.length ? "none" : "block";

  const optMap = courseOptionsMapBySem[currentSemesterIdx];
  let ectsSum = 0;
  for (const w of cur().wishlist) {
    const c = courseIndex[w.code];
    if (c && typeof c.ects === "number") ectsSum += c.ects;

    const div = document.createElement("div");
    div.className = "wishlist-item";
    div.style.borderLeft = `4px solid ${cur().colorAssignment[w.code] || "#888"}`;

    const options = (optMap[w.code] || []).filter(opt => !opt.sessions.some(s => excludedDays.has(s.day)));
    let groupSelectHtml = "";
    if (options.length > 1) {
      const currentOverride = cur().manualOverrides[w.code];
      let opts = `<option value="">${t("auto")}</option>`;
      options.forEach((opt, idx) => {
        opts += `<option value="${idx}" ${currentOverride === idx ? "selected" : ""}>${escapeHtml(opt.label)}</option>`;
      });
      groupSelectHtml = `<label class="group-select-label">${t("groupLabel")}
        <select class="group-select" data-code="${w.code}">${opts}</select>
      </label>`;
    }

    div.innerHTML = `
      <div class="row1">
        <span class="code">${w.code}</span>
        <button class="remove-btn" data-code="${w.code}" title="${t("remove")}">×</button>
      </div>
      <div class="name">${escapeHtml(c ? c.name : w.code)}</div>
      ${groupSelectHtml}
      <div class="controls">
        <label>${t("priority")} <input type="range" min="1" max="10" value="${w.priority}" data-code="${w.code}" class="prio-input"> ${w.priority}</label>
        <label><input type="checkbox" ${w.mandatory ? "checked" : ""} data-code="${w.code}" class="mand-input"> ${t("mandatory")}</label>
      </div>
    `;
    container.appendChild(div);
  }

  container.querySelectorAll(".remove-btn").forEach(b => b.addEventListener("click", () => removeFromWishlist(b.dataset.code)));
  container.querySelectorAll(".prio-input").forEach(inp => {
    inp.addEventListener("input", () => {
      inp.closest(".controls").querySelector("label").lastChild.textContent = " " + inp.value;
      updatePriority(inp.dataset.code, inp.value);
    });
  });
  container.querySelectorAll(".mand-input").forEach(inp => {
    inp.addEventListener("change", () => updateMandatory(inp.dataset.code, inp.checked));
  });
  container.querySelectorAll(".group-select").forEach(sel => {
    sel.addEventListener("change", () => {
      const code = sel.dataset.code;
      if (sel.value === "") delete cur().manualOverrides[code];
      else cur().manualOverrides[code] = Number(sel.value);
      saveWishlist();
      if (cur().lastResult) runSolve();
    });
  });

  const maxEcts = Number(document.getElementById("max-ects").value) || null;
  document.getElementById("ects-label").textContent = `${ectsSum.toFixed(1)} / ${maxEcts ?? "∞"} ECTS`;
  const fill = document.getElementById("ects-fill");
  const pct = maxEcts ? Math.min(100, (ectsSum / maxEcts) * 100) : 0;
  fill.style.width = pct + "%";
  fill.classList.toggle("over", maxEcts != null && ectsSum > maxEcts);

  document.getElementById("generate-btn").disabled = cur().wishlist.length === 0;
  document.getElementById("clear-btn").disabled = cur().wishlist.length === 0;
}

// ---- Solve + calendar rendering ----
function getMaxEcts() {
  const v = document.getElementById("max-ects").value;
  return v === "" ? null : Number(v);
}

// ---- Dag-uitsluiting: filtert opties die een sessie hebben op een dag
// waarop de student geen les wil (bv. woensdag wegens andere verplichtingen) ----
function filterOptionsExcludingDays(optMap) {
  if (excludedDays.size === 0) return { filtered: optMap, dayExcludedCodes: new Set() };
  const filtered = {};
  const dayExcludedCodes = new Set();
  for (const code of Object.keys(optMap)) {
    const opts = optMap[code].filter(opt => !opt.sessions.some(s => excludedDays.has(s.day)));
    filtered[code] = opts;
    if (opts.length === 0 && optMap[code].length > 0) dayExcludedCodes.add(code);
  }
  return { filtered, dayExcludedCodes };
}

function runSolve() {
  const maxEcts = getMaxEcts();
  const bufferMin = Number(document.getElementById("building-buffer").value) || 0;
  const { filtered: optMap, dayExcludedCodes } = filterOptionsExcludingDays(courseOptionsMapBySem[currentSemesterIdx]);
  cur().lastResult = solveSchedule(cur().wishlist, optMap, courseEcts, maxEcts, cur().manualOverrides, bufferMin);
  cur().lastResult.dayExcludedCodes = dayExcludedCodes;
  renderCalendar();
  renderIncludedList();
  renderSuggestions();
  renderNotPlaced();
  renderStatus();
  document.getElementById("ics-btn").disabled = !cur().lastResult || cur().lastResult.selected.size === 0;
}

// ---- Vakken in het gegenereerde rooster (met ECTS-totaal) ----
function renderIncludedList() {
  const container = document.getElementById("included-list");
  container.innerHTML = "";
  const result = cur().lastResult;
  if (!result || result.selected.size === 0) return;

  let total = 0;
  const rows = [];
  for (const [code, opt] of result.selected.entries()) {
    const c = courseIndex[code];
    const ects = c && typeof c.ects === "number" ? c.ects : 0;
    total += ects;
    rows.push({ code, name: c ? c.name : code, ects, color: cur().colorAssignment[code] });
  }
  rows.sort((a, b) => a.code.localeCompare(b.code));

  const block = document.createElement("div");
  block.className = "list-block";
  block.innerHTML = `<div class="list-block-title"><span>${t("includedTitle")}</span><span class="total">${total.toFixed(1)} ECTS</span></div>`;
  for (const r of rows) {
    const item = document.createElement("div");
    item.className = "list-item";
    item.style.borderLeft = `3px solid ${r.color || "#888"}`;
    item.innerHTML = `<span class="li-name"><span class="li-code">${r.code}</span> ${escapeHtml(r.name)}</span><span class="li-ects">${r.ects} ECTS</span>`;
    block.appendChild(item);
  }
  container.appendChild(block);
}

// ---- Suggesties: vakken die nog passen binnen het huidige rooster + ECTS-budget ----
function computeSuggestions() {
  const result = cur().lastResult;
  if (!result) return [];
  const maxEcts = getMaxEcts();
  if (maxEcts == null) return []; // zonder ECTS-limiet is "resterende ruimte" niet gedefinieerd
  const remaining = maxEcts - result.totalEcts;
  if (remaining <= 0.001) return [];

  const placedSessions = [];
  for (const opt of result.selected.values()) placedSessions.push(...opt.sessions);
  const bufferMin = Number(document.getElementById("building-buffer").value) || 0;

  const inWishlist = new Set(cur().wishlist.map(w => w.code));
  const { filtered: optMap } = filterOptionsExcludingDays(courseOptionsMapBySem[currentSemesterIdx]);
  const suggestions = [];
  for (const code of codesForSemester(currentSemesterIdx)) {
    if (inWishlist.has(code)) continue;
    const c = courseIndex[code];
    const ects = typeof c.ects === "number" ? c.ects : 0;
    if (ects > remaining + 1e-9) continue;
    const options = optMap[code] || [];
    const fitIdx = options.findIndex(opt => !optionConflictsWithPlaced(opt, placedSessions, bufferMin));
    if (fitIdx === -1) continue;
    suggestions.push({ code, name: c.name, ects, optionIdx: fitIdx });
  }
  // Grootste ECTS eerst voorstellen: vult het resterende budget het efficiëntst op
  suggestions.sort((a, b) => b.ects - a.ects || a.code.localeCompare(b.code));
  return suggestions.slice(0, 25); // niet oneindig lang, de meest kansrijke volstaan
}

function renderSuggestions() {
  const container = document.getElementById("suggestions-list");
  container.innerHTML = "";
  const suggestions = computeSuggestions();
  if (suggestions.length === 0) return;

  const block = document.createElement("div");
  block.className = "list-block";
  block.innerHTML = `<div class="list-block-title"><span>${t("suggestionsTitle")}</span></div>`;
  for (const s of suggestions) {
    const item = document.createElement("div");
    item.className = "list-item suggestion-item";
    item.innerHTML = `<span class="add-icon">+</span><span class="li-name"><span class="li-code">${s.code}</span> ${escapeHtml(s.name)}</span><span class="li-ects">${s.ects} ECTS</span>`;
    item.addEventListener("click", () => addSuggestion(s.code, s.optionIdx));
    block.appendChild(item);
  }
  container.appendChild(block);
}

function addSuggestion(code, optionIdx) {
  if (cur().wishlist.some(w => w.code === code)) return;
  cur().wishlist.push({ code, priority: 5, mandatory: false });
  cur().colorAssignment[code] = nextColorFor(currentSemesterIdx);
  // De optie is al gevalideerd als conflictvrij t.o.v. het huidige rooster --
  // vastzetten zodat de solver 'm exact zo overneemt, niet iets anders kiest.
  cur().manualOverrides[code] = optionIdx;
  saveWishlist();
  renderCourseList();
  renderWishlist();
  runSolve();
}

function timeStr(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

function renderCalendar() {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";
  document.getElementById("swap-container").innerHTML = "";
  openSwapCode = null;

  if (!cur().lastResult || cur().lastResult.selected.size === 0) {
    cal.innerHTML = `<div class="empty-msg">${t("noScheduleYet")}</div>`;
    return;
  }

  // Sessies filteren op de gekozen roosterhelft (B1/B2). Sessies zonder
  // B1/B2-specifieke periodiciteit (bv. wekelijkse "Q"-vakken, of "-")
  // horen bij BEIDE helften en blijven altijd zichtbaar.
  const visibleEntries = []; // [code, session]
  for (const [code, opt] of cur().lastResult.selected.entries()) {
    for (const s of opt.sessions) {
      const tags = parsePeriodTags(s.period);
      const h = half(tags);
      if (h === "both" || h === cur().calendarHalf) visibleEntries.push([code, s]);
    }
  }

  if (visibleEntries.length === 0) {
    cal.innerHTML = `<div class="empty-msg">${t("noSessionsThisHalf")}</div>`;
    return;
  }

  // Tijdsbereik dynamisch bepalen a.h.v. de daadwerkelijk zichtbare sessies
  let minStart = 24 * 60, maxEnd = 0;
  for (const [, s] of visibleEntries) {
    minStart = Math.min(minStart, s.start);
    maxEnd = Math.max(maxEnd, s.end);
  }
  minStart = Math.floor(minStart / 60) * 60;
  maxEnd = Math.ceil(maxEnd / 60) * 60;

  const ROW_H = 24;   // px per 30 minuten
  const PAD = 14;     // px ruimte boven/onder zodat de eerste/laatste tijdlabels niet afgeknipt worden
  const totalSlots = (maxEnd - minStart) / 30;
  const gridHeight = totalSlots * ROW_H;
  const bodyHeight = gridHeight + PAD * 2;

  const inner = document.createElement("div");
  inner.className = "cal-inner";

  // Header: lege hoek + 5 dagnamen
  const headerRow = document.createElement("div");
  headerRow.className = "cal-header-row";
  headerRow.appendChild(elWithClass("div", "cal-header-spacer"));
  for (let d = 1; d <= 5; d++) {
    const h = elWithClass("div", "cal-header-day");
    h.textContent = DAY_NAMES()[d];
    headerRow.appendChild(h);
  }
  inner.appendChild(headerRow);

  // Body: gutter (tijden) + dagen-vlak, beide met vaste hoogte in px.
  // PAD zorgt dat het eerste/laatste tijdlabel niet tegen de rand aan clipt.
  const body = elWithClass("div", "cal-body");
  body.style.height = bodyHeight + "px";

  const gutter = elWithClass("div", "cal-gutter");
  for (let min = minStart; min <= maxEnd; min += 60) {
    const label = elWithClass("div", "cal-time-label");
    label.style.top = (PAD + (min - minStart) / 30 * ROW_H - 5) + "px";
    label.textContent = timeStr(min);
    gutter.appendChild(label);
  }
  body.appendChild(gutter);

  const daysArea = elWithClass("div", "cal-days");
  daysArea.style.backgroundImage =
    `repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 1px, transparent 1px, transparent ${ROW_H * 2}px)`;
  daysArea.style.backgroundPosition = `0 ${PAD}px`;
  // verticale scheidingslijnen tussen de 5 dagen
  for (let d = 1; d < 5; d++) {
    const divider = elWithClass("div", "cal-day-divider");
    divider.style.left = (d / 5 * 100) + "%";
    daysArea.appendChild(divider);
  }
  body.appendChild(daysArea);
  inner.appendChild(body);
  cal.appendChild(inner);

  // Lesblokken plaatsen -- pure px/percentage-positionering, geen CSS-grid-plaatsing
  const dayWidthPct = 100 / 5;
  for (const [code, s] of visibleEntries) {
    const block = elWithClass("div", "cal-block");
    const top = PAD + (s.start - minStart) / 30 * ROW_H;
    const height = Math.max(16, (s.end - s.start) / 30 * ROW_H - 1);
    block.style.top = top + "px";
    block.style.height = height + "px";
    block.style.left = `calc(${(s.day - 1) * dayWidthPct}% + 2px)`;
    block.style.width = `calc(${dayWidthPct}% - 4px)`;
    block.style.borderLeftColor = cur().colorAssignment[code] || "var(--blue)";
    const groupTag = s.group ? ` · ${t("groupLabel")} ${escapeHtml(s.group)}` : "";
    const isFallback = courseIndex[code]?.fallbackSemesters.includes(currentSemesterIdx);
    block.innerHTML = `<div class="code">${code} [${s.type}]${groupTag}</div>${escapeHtml(courseIndex[code]?.name || "")}<div class="room">${escapeHtml(s.room)} · ${timeStr(s.start)}–${timeStr(s.end)}</div>${isFallback ? `<div class="fallback-note">${t("fallbackNote")}</div>` : ""}`;
    block.addEventListener("click", () => toggleSwapPanel(code));
    daysArea.appendChild(block);
  }
}

function elWithClass(tag, cls) {
  const e = document.createElement(tag);
  e.className = cls;
  return e;
}

function toggleSwapPanel(code) {
  openSwapCode = openSwapCode === code ? null : code;
  renderSwapPanel();
}

function renderSwapPanel() {
  const container = document.getElementById("swap-container");
  container.innerHTML = "";
  if (!openSwapCode || !cur().lastResult) return;
  const code = openSwapCode;
  const options = (courseOptionsMapBySem[currentSemesterIdx][code] || [])
    .filter(opt => !opt.sessions.some(s => excludedDays.has(s.day)));
  const currentOpt = cur().lastResult.selected.get(code);

  // sessies van ALLE andere geplaatste vakken (voor conflictcheck bij wisselen)
  const otherSessions = [];
  for (const [c, opt] of cur().lastResult.selected.entries()) {
    if (c === code) continue;
    otherSessions.push(...opt.sessions);
  }

  const panel = document.createElement("div");
  panel.className = "swap-panel";
  let html = `<h3>${code} ${t("swapTitle")}</h3>`;
  options.forEach((opt, idx) => {
    const isCurrent = opt === currentOpt;
    const conflicts = !isCurrent && optionConflictsWithPlaced(opt, otherSessions);
    html += `<div class="swap-opt ${isCurrent ? "current" : ""}">
      <span>${escapeHtml(opt.label)}${conflicts ? `<br><span class="disabled-note">${t("conflictsNote")}</span>` : ""}</span>
      ${isCurrent ? `<button disabled>${t("current")}</button>` : conflicts ? "" : `<button data-idx="${idx}">${t("use")}</button>`}
    </div>`;
  });
  panel.innerHTML = html;
  const closeBtn = document.createElement("button");
  closeBtn.className = "close-swap";
  closeBtn.textContent = t("close");
  closeBtn.addEventListener("click", () => { openSwapCode = null; renderSwapPanel(); });
  panel.appendChild(closeBtn);

  panel.querySelectorAll("button[data-idx]").forEach(b => {
    b.addEventListener("click", () => {
      cur().manualOverrides[code] = Number(b.dataset.idx);
      saveWishlist();
      runSolve();
    });
  });
  container.appendChild(panel);
}

function renderNotPlaced() {
  const container = document.getElementById("not-placed");
  container.innerHTML = "";
  if (!cur().lastResult) return;

  if (cur().lastResult.infeasibleMandatory) {
    container.innerHTML = `<div class="item"><div class="name">${t("infeasibleTitle")}</div>
      <div class="reason">${t("infeasibleReason")}</div></div>`;
    return;
  }

  for (const code of cur().lastResult.notSelected) {
    const c = courseIndex[code];
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<div class="name">${code} — ${escapeHtml(c ? c.name : "")}</div>
      <div class="reason">${t("notPlacedReason")}</div>`;
    container.appendChild(div);
  }
  for (const code of cur().lastResult.missing) {
    const c = courseIndex[code];
    const div = document.createElement("div");
    div.className = "item missing";
    const isDayExcluded = cur().lastResult.dayExcludedCodes && cur().lastResult.dayExcludedCodes.has(code);
    div.innerHTML = `<div class="name">${code} — ${escapeHtml(c ? c.name : t("unknownCourse"))}</div>
      <div class="reason">${isDayExcluded ? t("dayExcludedReason") : t("missingReason")}</div>`;
    container.appendChild(div);
  }
}

function renderStatus() {
  const el = document.getElementById("status-line");
  if (!cur().lastResult) { el.textContent = ""; return; }
  if (cur().lastResult.infeasibleMandatory) { el.textContent = t("statusInfeasible"); return; }
  el.textContent = t("statusOk")(cur().lastResult.selected.size, cur().lastResult.totalEcts.toFixed(1));
}

function renderAll() {
  renderCourseList();
  renderWishlist();
  syncHalfToggleUI();
}

// ==================== .ics-agenda-export ====================
// Belangrijk: dit exporteert de VOLLEDIGE oplossing (B1 én B2), niet enkel
// de huidige B1/B2-schakelaarweergave -- de datumbereiken per helft zorgen
// er zelf al voor dat B1-lessen alleen in de B1-weken verschijnen en
// omgekeerd, dus de agenda-app toont automatisch het juiste beeld.

function pad2(n) { return String(n).padStart(2, "0"); }
function icsDate(d) { return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
function icsDateTime(d, hh, mm) { return icsDate(d) + "T" + pad2(hh) + pad2(mm) + "00"; }
function parseISODate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const c = new Date(d); c.setDate(c.getDate() + n); return c; }
function firstOnOrAfter(date, weekday) {
  const c = new Date(date);
  while (c.getDay() !== weekday) c.setDate(c.getDate() + 1);
  return c;
}
function mondayOf(date) {
  const day = date.getDay();
  return addDays(date, day === 0 ? -6 : 1 - day);
}
function weekParityAt(date, refMondayA) {
  const weeks = Math.round((mondayOf(date) - refMondayA) / (7 * 86400000));
  return (((weeks % 2) + 2) % 2) === 0 ? "A" : "B";
}
function icsEscape(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}

function buildVEvent(code, name, s, anchors, uid) {
  const startH = Math.floor(s.start / 60), startM = s.start % 60;
  const endH = Math.floor(s.end / 60), endM = s.end % 60;
  const summary = icsEscape(`${code} ${name} [${s.type}]${s.group ? " · Gr " + s.group : ""}`);
  const location = icsEscape(s.room);
  let desc = t("icsCaveat");
  if (s.teacher) desc += "\n" + t("groupLabel") + ": " + s.teacher;
  desc = icsEscape(desc);

  // CUSTOM: exacte, eenmalige datum (geen herhaling nodig -- we kennen 'm echt)
  if ((s.period || "").trim() === "CUSTOM" && s.cStart) {
    const dd = parseDDMMYYYY(s.cStart);
    if (dd) {
      return [
        "BEGIN:VEVENT",
        `UID:${uid}@horarix`,
        `DTSTART:${icsDateTime(dd, startH, startM)}`,
        `DTEND:${icsDateTime(dd, endH, endM)}`,
        `SUMMARY:${summary}`,
        `LOCATION:${location}`,
        `DESCRIPTION:${desc}`,
        "END:VEVENT",
      ].join("\r\n");
    }
  }

  const tags = parsePeriodTags(s.period);
  const h = half(tags);
  const par = parity(tags);

  let winStart = parseISODate(anchors.semesterStart);
  let winEnd = parseISODate(anchors.semesterEnd);
  if (h === "B1") winEnd = parseISODate(anchors.b1End);
  else if (h === "B2") winStart = parseISODate(anchors.b2Start);

  let first = firstOnOrAfter(winStart, s.day);
  let interval = 1;
  if (par !== "both") {
    interval = 2;
    const refA = parseISODate(anchors.refMondayA);
    let guard = 0;
    while (weekParityAt(first, refA) !== par && guard < 14) { first = addDays(first, 7); guard++; }
  }
  if (first > winEnd) return null; // past niet meer binnen het venster -> overslaan

  const untilStr = icsDate(winEnd) + "T235959";
  return [
    "BEGIN:VEVENT",
    `UID:${uid}@horarix`,
    `DTSTART:${icsDateTime(first, startH, startM)}`,
    `DTEND:${icsDateTime(first, endH, endM)}`,
    `RRULE:FREQ=WEEKLY;INTERVAL=${interval};UNTIL=${untilStr}`,
    `SUMMARY:${summary}`,
    `LOCATION:${location}`,
    `DESCRIPTION:${desc}`,
    "END:VEVENT",
  ].join("\r\n");
}

function generateICS() {
  const result = cur().lastResult;
  if (!result || result.selected.size === 0) return null;
  const anchors = RAW_DATA.semesterMeta[currentSemesterIdx].calendarAnchors;

  const events = [];
  let counter = 0;
  for (const [code, opt] of result.selected.entries()) {
    const name = courseIndex[code]?.name || code;
    for (const s of opt.sessions) {
      counter++;
      const ev = buildVEvent(code, name, s, anchors, `horarix-${code}-${counter}-${Date.now()}`);
      if (ev) events.push(ev);
    }
  }
  if (events.length === 0) return null;

  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Horarix//ESEIAAT Erasmus roosterbouwer//EN",
    "CALSCALE:GREGORIAN",
    ...events,
    "END:VCALENDAR",
  ].join("\r\n");
}

function exportICS() {
  const ics = generateICS();
  if (!ics) return;
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `horarix-${RAW_DATA.semesterMeta[currentSemesterIdx].raw.includes("fall") ? "fall" : "spring"}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
// ==================== einde .ics-agenda-export ====================

function syncHalfToggleUI() {
  document.querySelectorAll("#half-toggle button").forEach(
    b => b.classList.toggle("active", b.dataset.half === cur().calendarHalf)
  );
}

// ---- Init ----
document.getElementById("search").addEventListener("input", renderCourseList);
document.getElementById("filter-lang").addEventListener("change", renderCourseList);
document.getElementById("filter-level").addEventListener("change", renderCourseList);
document.getElementById("filter-semester").addEventListener("change", (e) => {
  const val = e.target.value;
  if (val === "all") {
    browseAll = true;
    // currentSemesterIdx blijft ongewijzigd -- enkel de vakkenlijst breidt uit,
    // de wishlist/rooster-panelen blijven het actieve planningssemester tonen.
  } else {
    browseAll = false;
    currentSemesterIdx = Number(val);
  }
  openSwapCode = null;
  saveWishlist();
  renderAll();
  if (cur().lastResult) { renderCalendar(); renderIncludedList(); renderSuggestions(); renderNotPlaced(); renderStatus(); }
  else {
    document.getElementById("calendar").innerHTML = `<div class="empty-msg">${t("noScheduleYet")}</div>`;
    document.getElementById("included-list").innerHTML = "";
    document.getElementById("suggestions-list").innerHTML = "";
    renderNotPlaced(); renderStatus();
  }
  document.getElementById("ics-btn").disabled = !cur().lastResult || cur().lastResult.selected.size === 0;
});
document.getElementById("max-ects").addEventListener("input", () => { renderWishlist(); if (cur().lastResult) runSolve(); });
document.getElementById("building-buffer").addEventListener("change", () => { if (cur().lastResult) runSolve(); });
document.getElementById("generate-btn").addEventListener("click", runSolve);
document.getElementById("ics-btn").addEventListener("click", exportICS);
document.getElementById("clear-btn").addEventListener("click", clearWishlist);
document.getElementById("lang-select").addEventListener("change", (e) => {
  currentLang = e.target.value;
  saveWishlist();
  applyStaticTranslations();
  renderAll();
  if (cur().lastResult) { renderCalendar(); renderIncludedList(); renderSuggestions(); renderNotPlaced(); renderStatus(); }
});
document.getElementById("half-toggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-half]");
  if (!btn) return;
  cur().calendarHalf = btn.dataset.half;
  document.querySelectorAll("#half-toggle button").forEach(b => b.classList.toggle("active", b === btn));
  saveWishlist();
  if (cur().lastResult) renderCalendar();
});
document.getElementById("day-toggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-day]");
  if (!btn) return;
  const day = Number(btn.dataset.day);
  if (excludedDays.has(day)) excludedDays.delete(day); else excludedDays.add(day);
  btn.classList.toggle("excluded", excludedDays.has(day));
  saveWishlist();
  renderCourseList(); // aantal groepen/opties in de lijst kan wijzigen door de dagfilter
  if (cur().lastResult) runSolve();
});

function syncDayToggleUI() {
  document.querySelectorAll("#day-toggle button").forEach(
    b => b.classList.toggle("excluded", excludedDays.has(Number(b.dataset.day)))
  );
}

(async function init() {
  await loadWishlist();
  applyStaticTranslations();
  syncHalfToggleUI();
  syncDayToggleUI();
  renderAll();
  if (cur().wishlist.length) runSolve();
})();
</script>
